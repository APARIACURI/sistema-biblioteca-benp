spring.application.name=sistema-biblioteca-benp

# ===================== Base de datos MySQL =====================
# Ajusta usuario/clave segun tu entorno. Se asume la misma BD "biblioteca"
# que ya usaba el proyecto original (mismas tablas: libros, usuarios, prestamos, multas).
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
# "update" para no romper datos existentes. Cambialo a "validate" en produccion.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== Thymeleaf (panel admin) =====================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.port=8081
