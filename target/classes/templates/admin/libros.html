<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Libros</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="text-2xl font-black text-[#5D4037] mb-6">Catálogo de libros</h2>

    <div class="bg-white rounded-2xl shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-[#FFF3E0] text-[#5D4037] text-left">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Título</th>
                <th class="p-4">Autor</th>
                <th class="p-4">Categoría</th>
                <th class="p-4">Editorial</th>
                <th class="p-4">Año</th>
                <th class="p-4">ISBN</th>
                <th class="p-4">Stock</th>
                <th class="p-4">Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="libro : ${libros}" class="border-t hover:bg-gray-50">
                <td class="p-4" th:text="${libro.id}">1</td>
                <td class="p-4 font-bold" th:text="${libro.titulo}">Título</td>
                <td class="p-4" th:text="${libro.autor}">Autor</td>
                <td class="p-4" th:text="${libro.categoria}">Categoría</td>
                <td class="p-4" th:text="${libro.editorial}">Editorial</td>
                <td class="p-4" th:text="${libro.anio}">Año</td>
                <td class="p-4" th:text="${libro.isbn}">ISBN</td>
                <td class="p-4" th:text="${libro.stock}">0</td>
                <td class="p-4">
                        <span class="px-2 py-1 rounded-full text-xs font-bold"
                              th:classappend="${libro.estado == 'Disponible'} ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'"
                              th:text="${libro.estado}">Estado</span>
                </td>
            </tr>
            <tr th:if="${libros.isEmpty()}">
                <td colspan="9" class="p-6 text-center text-gray-400 font-bold">No hay libros registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
