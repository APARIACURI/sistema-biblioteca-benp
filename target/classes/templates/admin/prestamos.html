<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Préstamos</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="text-2xl font-black text-[#5D4037] mb-6">Préstamos</h2>

    <div class="bg-white rounded-2xl shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-[#FFF3E0] text-[#5D4037] text-left">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Libro</th>
                <th class="p-4">Usuario</th>
                <th class="p-4">F. Préstamo</th>
                <th class="p-4">F. Vencimiento</th>
                <th class="p-4">Estado</th>
                <th class="p-4">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prestamos}" class="border-t hover:bg-gray-50">
                <td class="p-4" th:text="${p.id}">1</td>
                <td class="p-4 font-bold" th:text="${p.tituloLibro}">Título</td>
                <td class="p-4" th:text="${p.nombreUsuario}">Usuario</td>
                <td class="p-4" th:text="${p.fechaPrestamo}">2026-01-01</td>
                <td class="p-4" th:text="${p.fechaVencimiento}">-</td>
                <td class="p-4">
                        <span class="px-2 py-1 rounded-full text-xs font-bold"
                              th:classappend="${p.estado == 'Activo'} ? 'bg-amber-100 text-amber-700' : (${p.estado == 'Devuelto'} ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600')"
                              th:text="${p.estado}">Pendiente</span>
                </td>
                <td class="p-4">
                    <form th:if="${p.estado == 'Pendiente'}" method="post"
                          th:action="@{/admin/prestamos/{id}/estado(id=${p.id})}" class="inline">
                        <input type="hidden" name="nuevoEstado" value="Activo"/>
                        <button type="submit" class="text-xs font-bold text-amber-700 hover:underline">Entregar</button>
                    </form>
                    <form th:if="${p.estado == 'Activo'}" method="post"
                          th:action="@{/admin/prestamos/{id}/estado(id=${p.id})}" class="inline">
                        <input type="hidden" name="nuevoEstado" value="Devuelto"/>
                        <button type="submit" class="text-xs font-bold text-green-700 hover:underline">Recibir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${prestamos.isEmpty()}">
                <td colspan="7" class="p-6 text-center text-gray-400 font-bold">No hay préstamos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
