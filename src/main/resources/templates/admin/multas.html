<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Multas</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="text-2xl font-black text-[#5D4037] mb-6">Multas</h2>

    <div class="bg-white rounded-2xl shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-[#FFF3E0] text-[#5D4037] text-left">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Usuario</th>
                <th class="p-4">Libro</th>
                <th class="p-4">Motivo</th>
                <th class="p-4">Monto</th>
                <th class="p-4">Fecha</th>
                <th class="p-4">Estado</th>
                <th class="p-4">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${multas}" class="border-t hover:bg-gray-50">
                <td class="p-4" th:text="${m.id}">1</td>
                <td class="p-4 font-bold" th:text="${m.user}">Usuario</td>
                <td class="p-4" th:text="${m.book}">Libro</td>
                <td class="p-4 text-gray-500" th:text="${m.reason}">Motivo</td>
                <td class="p-4 font-black text-red-500" th:text="'S/ ' + ${#numbers.formatDecimal(m.amount, 1, 2)}">S/ 0.00</td>
                <td class="p-4" th:text="${m.date}">2026-01-01</td>
                <td class="p-4">
                        <span class="px-2 py-1 rounded-full text-xs font-bold"
                              th:classappend="${m.status == 'Pagado'} ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'"
                              th:text="${m.status}">Pendiente</span>
                </td>
                <td class="p-4">
                    <form th:if="${m.status == 'Pendiente'}" method="post"
                          th:action="@{/admin/multas/{id}/pagar(id=${m.id})}" class="inline">
                        <button type="submit" class="text-xs font-bold text-green-700 hover:underline">Marcar pagada</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${multas.isEmpty()}">
                <td colspan="8" class="p-6 text-center text-gray-400 font-bold">No hay multas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
