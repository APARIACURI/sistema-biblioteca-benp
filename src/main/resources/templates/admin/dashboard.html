<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Dashboard</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="text-2xl font-black text-[#5D4037] mb-6">Resumen general</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl p-5 shadow">
            <p class="text-sm text-gray-500 font-semibold">Libros registrados</p>
            <p class="text-3xl font-black text-[#5D4037]" th:text="${totalLibros}">0</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow">
            <p class="text-sm text-gray-500 font-semibold">Usuarios registrados</p>
            <p class="text-3xl font-black text-[#5D4037]" th:text="${totalUsuarios}">0</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow">
            <p class="text-sm text-gray-500 font-semibold">Préstamos activos</p>
            <p class="text-3xl font-black text-amber-600" th:text="${prestamosActivos}">0</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow">
            <p class="text-sm text-gray-500 font-semibold">Multas pendientes</p>
            <p class="text-3xl font-black text-red-500" th:text="${multasPendientes}">0</p>
        </div>
    </div>
</div>
</body>
</html>
